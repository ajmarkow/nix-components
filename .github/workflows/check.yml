name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  check:
    uses: ajmarkow/ci-workflows/.github/workflows/nix-check.yml@v1
    with:
      # Both consumer arches. Unlike the host repos there is no single deploy
      # target to match: this flake is consumed by nix-mac (aarch64-darwin) and
      # by nix-server plus nix-pixelbook (x86_64-linux). `nix flake check` only
      # covers the runner's OWN system and prints "omitted these incompatible
      # systems" for the rest, so a single runner would leave the other arch
      # unguarded -- the bin/claude wrapper collision fixed in 4e422ba only
      # surfaced on darwin.
      systems: |
        [{"system":"x86_64-linux","runner":"ubicloud-standard-2"},
         {"system":"aarch64-darwin","runner":"avrea-macos-latest-8-vcpu"}]
      # check-flags deliberately empty. No --no-build: a full check is what
      # actually runs checks.<system>.diff-viewer (the tests/ unittest), which
      # --no-build silently reduces to "derivation evaluated to ...drv" without
      # executing a thing. No --impure either, unlike nix-mac -- nothing in this
      # repo reads builtins.getEnv.
      #
      # build-all-packages because `nix flake check` builds `checks` but only
      # EVALUATES `packages`, so a package that evaluates fine and fails to
      # compile would otherwise pass.
      build-all-packages: true
      build-flags: --no-link --print-out-paths
      # Honour this flake's own nixConfig (codex-cli.cachix.org), which Nix
      # otherwise refuses with "ignoring untrusted flake configuration setting
      # 'extra-substituters'" and then rebuilds the codex CLI from source.
      accept-flake-config: true
      # Pushing matters more here than in the host repos: this flake's packages
      # are what they all pull in, so a populated cache turns their builds into
      # downloads.
      cachix-cache: ajmarkow
      notify: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.INFISICAL_CACHIX_AUTH_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.INFISICAL_AJ_ALERTS_TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.INFISICAL_TELEGRAM_CHAT_ID }}
